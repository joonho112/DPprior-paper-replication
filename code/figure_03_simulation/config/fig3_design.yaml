# Figure 3 Simulation (R-only) — v2
# Author: JoonHo Lee
# Last updated: 2026-01-17

project:
  name: "Figure 3 Simulation (R-only)"
  author: "JoonHo Lee"

paths:
  results_dir: "results"
  priors_dir: "results/priors"
  sim_dir: "results/sim"
  figures_dir: "figures"
  logs_dir: "logs"

design:
  J: 100
  K_true_grid: [5, 10, 30]
  I_grid: [0.2, 0.5, 0.8]
  confidence_grid: ["low", "medium", "high"]

methods:
  # TSMM / Dual vary by confidence; baselines use confidence="none".
  list: ["vague", "tsmm", "dual", "doro_uniform", "chi2_doro"]

replications:
  pilot_R: 3
  full_R: 200

# Parallel computing defaults (used by step3_run_*_parallel.R)
parallel:
  enabled: true

  # plan: auto | multicore | multisession
  # - auto: multicore on macOS/Linux, multisession on Windows
  plan: auto

  # workers: null means 'auto' (OS-aware defaults).
  # You can override at the command line: --workers 12
  workers: null

  # chunk_size = number of replications handled per worker-chunk.
  # Larger values reduce scheduling overhead and keep worker-local caches warm.
  chunk_size: 1

  # Checkpoint/resume behavior
  skip_completed: true

  # If true, delete the parts directory after producing out_csv.
  cleanup_parts: false

seeds:
  calibration: 12345
  dgp_base: 20260116
  mcmc_base: 98765

dgp:
  sigma_tau: 0.25
  within_sd_raw: 0.15
  cluster_span_d: 2.5
  weights: "equal"        # "equal" or "dirichlet"
  n_cv: 0.5
  n_min: 5
  kappa: 4                # se^2 = kappa / n

calibration:
  n_sims: 2000
  grid_mult_low: 0.5
  grid_mult_high: 2.0
  grid_size: 31
  tol_abs: 0.01

priors:
  tsmm_method: "A2-MN"
  dual:
    trigger_prob_w1_gt_0_5: 0.40
    w1_target_prob: 0.25
    w1_threshold: 0.5
    lambda: 0.7
    loss_type: "adaptive"

mcmc:
  nchains: 2
  niter: 1000
  nburnin: 500
  thin: 1
  monitors: ["alpha", "z"]
  setSeed: true
  summary: false

plot:
  # v2: by default, plotting scripts will read:
  #   (1) raw_results_merged.csv if present, else
  #   (2) all raw_results_full_rep_*.csv if present, else
  #   (3) raw_results_pilot.csv
  main_confidence: "medium"
  main_methods: ["vague", "tsmm", "dual"]
  extended_methods: ["vague", "tsmm", "dual", "doro_uniform", "chi2_doro"]

  output_pdf: "figures/main/fig03_simulation_grid.pdf"
  output_png: "figures/main/fig03_simulation_grid.png"
